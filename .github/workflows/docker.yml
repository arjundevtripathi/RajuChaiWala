name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rajuchaiwala:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rajuchaiwala:latest
            docker stop rajuchaiwala || true
            docker rm rajuchaiwala || true
            docker run -d --name rajuchaiwala --restart unless-stopped \
              -p 8000:8000 \
              --env-file /home/ubuntu/app/.env \
              -v /home/ubuntu/app/faiss_index:/app/outputs/faiss_index \
              -v /home/ubuntu/app/hf_cache:/root/.cache/huggingface \
              ${{ secrets.DOCKERHUB_USERNAME }}/rajuchaiwala:latest
            docker image prune -f